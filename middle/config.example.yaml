# 复制为 middle/config.yaml

soul:
  base_url: "https://ai-trends.news"
  feed: "apps"
  replication_high_value: true
  published_within_days: 3
  page_size: 20

filter:
  min_worth_score: 7
  # 未指定时自动取各赛道 feed_kinds 的并集
  # feed_kinds: ["apps", "news"]

# 内容赛道：同一平台不同账号维护不同垂直（一账号一类型）
themes:
  - id: ai_monetize
    label: AI 变现
    description: 工具、副业、高价值复刻等变现向内容
    feed_kinds: ["apps"]
    accounts:
      douyin: { label: "抖音 · AI变现号" }
      xhs: { label: "小红书 · AI变现号" }
      toutiao: { label: "头条 · AI变现号" }
      douban: { label: "豆瓣 · AI变现号" }
  - id: ai_news
    label: AI 资讯
    description: AI 行业新闻、快讯与趋势解读
    feed_kinds: ["news"]
    accounts:
      douyin: { label: "抖音 · AI资讯号" }
      xhs: { label: "小红书 · AI资讯号" }
      toutiao: { label: "头条 · AI资讯号" }
      douban: { label: "豆瓣 · AI资讯号" }

# 站点 code（Soul 网站）与赛道绑定；账号卡片在控制台「渠道账号」维护
sites:
  - code: ai-trends-apps
    label: AI 变现站
    description: Soul 应用/变现向内容
    theme_id: ai_monetize
    base_url: "https://ai-trends.news"
  - code: ai-trends-news
    label: AI 资讯站
    description: Soul 资讯/快讯内容
    theme_id: ai_news
    base_url: "https://ai-trends.news"

# 渠道账号卡片（也可在 Web 控制台编辑后写回此文件）
channel_accounts: []

# 固定双批次 × 双无头浏览器槽位（网页操作为 Playwright 固定脚本，不用大模型）
publisher:
  headless: true
  slots:
    - slot_id: 1
      batch_id: batch_a
      label: 主体A · AI变现
    - slot_id: 2
      batch_id: batch_b
      label: 主体B · AI资讯
  batches:
    - batch_id: batch_a
      site_code: ai-trends-apps
      theme_id: ai_monetize
      label: AI 变现主体
    - batch_id: batch_b
      site_code: ai-trends-news
      theme_id: ai_news
      label: AI 资讯主体
      shared_profile_id: acc_ai_news_shared

# render.platforms 含发布目标；video_template_platform 只渲抖音模板；
# mirror_video_to 将 douyin.mp4 复制为 xhs.mp4（文案仍用 xhs_title/body）

paths:
  data_dir: "./data"
  # 默认同仓库根目录（VideoShortsAgent），一般留空
  vsa_root: ""
  broll_template: ""

site:
  public_base_url: "https://ai-trends.news"

# TTS（仓库根 .env，见 .env.example）
# TTS_PROVIDER=auto          # auto | edge | dashscope | azure | openai
# TTS_FALLBACK=dashscope,azure,openai
# DASHSCOPE_API_KEY=sk-xxx   # 推荐：Edge 503 时自动切换
# AZURE_SPEECH_KEY= + AZURE_SPEECH_REGION=eastasia
# OPENAI_API_KEY=            # 最后备用
# TTS_MAX_RETRIES=6 / TTS_MAX_CONCURRENT=1 / TTS_CACHE=1

render:
  enabled: false
  # pipeline = B-roll 切片 + ASS；slides = Remotion TitleCard/ContentCard（「每天一个 GitHub」风）
  mode: pipeline
  scene: daily_github
  visual_style: tech_blue
  bgm: upbeat_tech
  slides_image_mode: search
  platforms: ["douyin", "xhs"]
  video_template_platform: douyin
  mirror_video_to: ["xhs"]
  # 默认 Remotion 句级字幕 + 渐变（需 cd remotion_effects && npm install）
  use_remotion: true
  skip_tts: false
  # 生产 false；LLM 欠费/失败时仅调试可开 true
  allow_template_fallback: false
  parallel: true
  parallel_workers: 2
  max_concurrent: 1
  retry_max: 1
  verify_required: true
  full_verify: false
  # 任一步失败（TTS/渲染/验收/绑定）→ 任务 FAILED，禁止标记发布
  fail_closed: true
  bookends: both
  ffmpeg_preset: fast

llm:
  enabled: true
  require_polish: true
  plan_retries: 2
  # 推荐：仓库根目录 .env → DEEPSEEK_API_KEY=sk-xxx（勿提交 git）
  api_key_env: DEEPSEEK_API_KEY
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"

# 每日定时发布（scripts/run_daily_scheduled.py + register_windows_daily_task.ps1）
schedule:
  enabled: true
  # false = 只跑 pipeline（拉稿/成片），不自动调浏览器发布；手动见 publish_channel.py
  auto_publish: false
  service:
    enabled: true
    pipeline_interval_min: 30
    publish_hour_local: 10
    timezone: Asia/Shanghai
  pick_mode: random
  daily_publish_count: 3
  daily_publish_count_min: 2
  daily_publish_count_max: 3
  max_pipeline_jobs: 5
  theme_id: ai_news
  primary_channel: douyin
  channels: [douyin, toutiao, douban]
  skip_channels: [xhs]
  run_pipeline: true
  publish_verify: true
  login_check: true
  verify_wait_sec: 25
  gap_between_articles_sec: [180, 900]
  random_start_delay_sec: [0, 3600]
  log_dir: ./data/logs/schedule

server:
  host: "127.0.0.1"
  port: 8780
