name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run unit tests
        run: |
          pytest python_agent/tests/test_caption_timeline.py \
            python_agent/tests/test_slides_quality_gates.py \
            python_agent/tests/test_montage_timing.py \
            python_agent/tests/test_summary_timing.py \
            python_agent/tests/test_platform_caption_presets.py \
            python_agent/tests/test_word_timing.py \
            -q --tb=short
      - name: Slides eval (mock compose, no API)
        run: |
          python scripts/run_slides_eval.py --platform both --mock
        env:
          EVAL_MOCK_COMPOSE: "1"
