[package]
name = "video-shorts-studio"
version = "0.1.0"
description = "VideoShorts Studio desktop shell"
authors = ["pinximei"]
edition = "2021"

[lib]
name = "video_shorts_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vsa-core = { path = "../../../rust/vsa-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
